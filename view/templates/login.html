<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
</head>
<body style="margin: 0; min-height: 100vh; padding: 16px; box-sizing: border-box; display: flex;">

    <main style="margin: auto; width: 100%; max-width: 340px;">

        <h1 style="text-align: center;">
            SIÊU THỊ ĐIỆN MÁY
        </h1>

        <h2 style="text-align: center;">Đăng nhập</h2>

        {% if error %}
            <p role="alert"><strong>Lỗi:</strong> {{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <p>
                <label for="username">Tên đăng nhập:</label>
                <input type="text" id="username" name="username"
                       value="{{ username }}" maxlength="50"
                       autocomplete="username" required
                       style="display: block; width: 100%; box-sizing: border-box;">
            </p>

            <p>
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password"
                       maxlength="256" autocomplete="current-password"
                       required
                       style="display: block; width: 100%; box-sizing: border-box;">
            </p>

            <p style="text-align: center;">
                <button type="submit">Đăng nhập</button>
            </p>
        </form>

        <p style="text-align: center;">
            Chưa có tài khoản?
            <a href="{{ url_for('registration.register') }}">Đăng ký</a>
        </p>

    </main>
</body>
</html>
